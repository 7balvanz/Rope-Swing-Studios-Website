<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#000000">
<link rel="icon" href="assets/monogram.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<meta property="og:title" content="Rope Swing Studios">

<meta name="twitter:title" content="Rope Swing Studios">

<body class="subpage clients-page">
<a class="skip" href="#main">Skip to content</a>
<header class="header">
  <a class="brand" href="index.html" aria-label="Rope Swing Studios home"><img src="assets/header-logo.svg" width="108" height="96" alt="Rope Swing Studios"></a>
  <nav aria-label="Main navigation"><a href="studio.html">Our Studio <span>↗</span></a><a href="work.html">Our Work <span>↗</span></a><a href="games.html">Our Games <span>↗</span></a><a aria-current="page" href="clients.html">Our Clients <span>↗</span></a></nav>
</header>
<main id="main"><section class="work" aria-labelledby="clients-title">
  <div class="clients-section">
    <div class="games-heading"><h2 id="clients-title">Our Clients</h2><span>SELECTED PARTNERS</span></div>
    <div class="client-login">
      <div>
        <h3>Client Login</h3>
        <p>Existing clients can sign in to view their project materials.</p>
      </div>
      <button class="client-login-btn" type="button" id="open-login">Client Login</button>
    </div>
    <div class="client-logos">
      <div class="client-logo"><img src="assets/clients/dji.png" alt="DJI"></div>
      <div class="client-logo"><img src="assets/clients/ford.png" alt="Ford"></div>
      <div class="client-logo"><img src="assets/clients/john-deere.png" alt="John Deere"></div>
      <div class="client-logo"><img src="assets/clients/kodak.png" alt="Kodak"></div>
      <div class="client-logo"><img src="assets/clients/motorola.png" alt="Motorola"></div>
      <div class="client-logo"><img src="assets/clients/mountain-dew.png" alt="Mountain Dew"></div>
      <div class="client-logo"><img src="assets/clients/netflix.png" alt="Netflix"></div>
      <div class="client-logo"><img src="assets/clients/north-face.png" alt="The North Face"></div>
      <div class="client-logo"><img src="assets/clients/samsung.png" alt="Samsung"></div>
      <div class="client-logo"><img src="assets/clients/sony.png" alt="Sony"></div>
      <div class="client-logo"><img src="assets/clients/volvo.png" alt="Volvo"></div>
      <div class="client-logo"><img src="assets/clients/warner-bros.png" alt="Warner Bros."></div>
      <div class="client-logo"><img src="assets/clients/weber.png" alt="Weber"></div>
      <div class="client-logo"><img src="assets/clients/yahoo.png" alt="Yahoo"></div>
      <div class="client-logo"><img src="assets/clients/yeti.png" alt="YETI"></div>
    </div>
  </div>
</section></main>

<dialog class="client-dialog" id="login-dialog" aria-labelledby="dialog-title">
  <h3 id="dialog-title">Client Login</h3>
  <form method="dialog" id="login-form">
    <label for="login-email">Email</label>
    <input id="login-email" name="email" type="email" autocomplete="username">
    <label for="login-password">Password</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password">
    <div class="dialog-actions">
      <button type="button" id="cancel-login">Cancel</button>
      <button type="button" class="primary" id="sign-in" disabled>Sign in</button>
    </div>
  </form>
</dialog>

<footer><a href="index.html" class="footer-name">ROPE SWING STUDIOS</a><div><span>© <span id="year">2010</span></span><a href="index.html">Back to home ↗</a></div></footer>
<script src="site.js"></script>
<script>
  (() => {
    const dialog = document.getElementById('login-dialog');
    document.getElementById('open-login').addEventListener('click', () => dialog.showModal());
    document.getElementById('cancel-login').addEventListener('click', () => dialog.close());
  })();
</script>
</body>
</html>
